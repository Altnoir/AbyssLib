plugins {
    id 'net.neoforged.moddev'
}

// Deliberately no `base { archivesName = ... }`: the Gradle project name IS the full
// Maven artifactId (assigned in settings.gradle from mod_mc_suffix), and that value is
// also archivesName's default -- so the jar filename and the published coordinate can
// never drift apart.

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Atlas 的 datagen 助手（ALStructureDatagen#register）用了 Reginth 的 AbstractReginth /
    // DataProviderInitializer —— 同样只是 datagen 期依赖：本模块的运行时代码
    // （AbyssLibAtlas / ALGridPlacement / ALJigsawStructure 等）一处都不引用 reginth。
    //
    // 所以用 compileOnly 而**不** jarJar 内嵌，让 reginth 成为使用方的**可选**依赖：
    // 要 datagen 助手就自行依赖 com.altnoir:abysslib-reginth-1.21.1（或直接装聚合包 abysslib-1.21.1），
    // 不要就自己手写。项目名带 MC 线后缀，用 mod_mc_suffix 插值以免硬编码两份。
    compileOnly project(":abysslib-reginth${mod_mc_suffix}")
}
