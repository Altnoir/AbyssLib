# NOTE: gradle.properties is read by java.util.Properties (fixed ISO-8859-1).
# Non-Latin-1 characters must be written as \uXXXX escapes or they will be mangled.
# Keep this file ASCII-only: Gradle rewrites it during builds and non-ASCII comments
# have been observed to be dropped.
# -Dfile.encoding=UTF-8: make the Gradle daemon use UTF-8 for output/filtering.
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.21.2)
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# All four modules (aggregate + 3 features) MUST share this single version:
# jarJar de-duplication relies on matching versions.
# NOTE: 1.0.0 is the first "real" release; the pre-modularization builds used a
# separate legacy numbering (1.2.0 / 1.3.0 / 1.4.0 / 1.4.5) and are gone from repo/.
mod_version=1.0.0
mod_group_id=com.altnoir

# Maven artifactId suffix identifying this Minecraft line.
# Coordinates are: <mod_group_id>:<artifactId><mod_mc_suffix>:<mod_version>
#   com.altnoir:abysslib-1.21.1:1.0.0
#   com.altnoir:abysslib-reginth-1.21.1:1.0.0  (and -relink / -atlas)
#
# WHY: the 26.1 line publishes its own aggregate under the same group/version.
# Without the suffix both lines would resolve to the SAME coordinates and the
# second publish would silently overwrite the first -- a consumer asking for
# that version would get a jar for the wrong Minecraft version.
# This property is the single source of truth: settings.gradle reads it to name
# the Gradle projects (project name == artifactId, see settings.gradle).
mod_mc_suffix=-1.21.1
mod_license=MIT
mod_authors=Altnoir
