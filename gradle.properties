# 注意：gradle.properties 由 java.util.Properties 读取（固定 ISO-8859-1），
# 非 Latin-1 字符必须写成 \uXXXX 转义，否则会乱码。
# 26.1.2 线：NeoForge 26.1.2.94 / Java 25 / moddev 2.0.143（无 parchment）
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

minecraft_version=26.1.2
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.94
neo_version_range=[26.1.2,)
loader_version_range=[4,)

mod_id=abysslib
mod_name=AbyssLib
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.altnoir.abysslib
mod_authors=Altnoir
mod_description=Shared library for Altnoir mods (NeoForge 26.1.2): bundles Registrate MC26.1-1.5.7 and SimpleBedrockModel 2.5.0-mc26.1, provides ALRegistrate and sectioned creative tabs.

# Registrate（26.1 线由 maven.gegy.dev/releases 提供）
registrate_version=MC26.1-1.5.7
# SBM 26.1 无公开 maven，使用本地 libs 目录的 jar（见 build.gradle 的 prepareBundledSbm）
sbm_local_jar=simplebedrockmodel-2.5.0-neoforge-mc26.1.jar
