# AbyssLib-26.1.2 (NeoForge 26.1.2.94 / Java 25 / moddev 2.0.143, no parchment)
# NOTE: gradle.properties is read as ISO-8859-1; keep this file ASCII-only.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

minecraft_version=26.1.2
minecraft_version_range=[26.1,26.2)
neo_version=26.1.2.94
neo_version_range=[26.1.2,)
loader_version_range=[4,)

# All modules (aggregate + feature modules) MUST share this single version.
# mod_id / mod_name / mod_description live in each module's own gradle.properties.
mod_version=1.0.0
mod_group_id=com.altnoir

# Maven artifactId suffix identifying this Minecraft line.
# Coordinates are: <mod_group_id>:<artifactId><mod_mc_suffix>:<mod_version>
#   com.altnoir:abysslib-26.1.2:1.0.0
#   com.altnoir:abysslib-reginth-26.1.2:1.0.0
#
# WHY: the 1.21.1 line publishes its own aggregate under the same group and the same
# mod_version. Without the suffix both lines would resolve to the SAME coordinates and
# the second publish would silently overwrite the first -- a consumer asking for that
# version would get a jar for the wrong Minecraft version. Keep this value in sync with
# the 1.21.1 line's scheme (see that branch's gradle.properties).
mod_mc_suffix=-26.1.2
mod_license=MIT
mod_authors=Altnoir
