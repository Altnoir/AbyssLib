plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'AbyssLib'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 只有聚合模块定义 run 配置：一个 run 目录就能同时测到三个子模块
    // （子模块以 jar 形式位于类路径上，FML 会把它们各自当成一个 mod 加载）。
    runs {
        client {
            client()
            programArgument '--username'
            programArgument 'Player####'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // 沿用仓库根目录的 run/（eula 已接受、配置与存档都在那里），
            // 而不是默认的 module.main/run/。
            gameDirectory = rootProject.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // 聚合包本身不含业务代码：它把三个模块的 jar 全部内嵌（jarJar），
    // 用户只装这一个 jar 就能得到完整功能；开发者也可以只依赖单个模块。
    // api 让消费方在编译期同时看到全部模块的类型。
    //
    // 注意：ReLink / Atlas 对 Reginth 只有 datagen 期的 compileOnly 依赖（不内嵌，见各自 build.gradle），
    // 它们**不**把 Reginth 传递进来 —— 这里必须显式内嵌 Reginth，否则聚合包的消费方
    // 在用到 datagen 助手时会编译失败。三行都必要，别顺手删。
    jarJar(api project(':AbyssLib-Reginth'))
    jarJar(api project(':AbyssLib-ReLink'))
    jarJar(api project(':AbyssLib-Atlas'))
}
