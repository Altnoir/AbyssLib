plugins {
    id 'net.neoforged.moddev'
}

// Deliberately no `base { archivesName = ... }`: the Gradle project name IS the full
// Maven artifactId (assigned in settings.gradle from mod_mc_suffix), and that value is
// also archivesName's default -- so the jar filename and the published coordinate can
// never drift apart.

neoForge {
    version = project.neo_version

    // 只有聚合模块定义 run 配置：一个 run 目录就能同时测到子模块
    // （子模块以 jar 形式位于类路径上，FML 会把它们各自当成一个 mod 加载）。
    runs {
        client {
            client()
            programArgument '--username'
            programArgument 'Player####'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // 沿用仓库根目录的 run/，而不是默认的 module.main/run/
            gameDirectory = rootProject.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // 聚合包本身不含业务代码：它把 Reginth 模块的 jar 内嵌（jarJar），
    // 用户只装这一个 jar 就能得到完整功能；开发者也可以只依赖 abysslib-reginth。
    // 项目名带 MC 线后缀（mod_mc_suffix），用属性插值以免把 "26.1.2" 硬编码两份。
    jarJar(api project(":abysslib-reginth${mod_mc_suffix}"))
}
