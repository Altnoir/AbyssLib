pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// 各 Minecraft 版本使用独立 artifactId。
def rootProps = new Properties()
new File(settingsDir, 'gradle.properties').withInputStream { rootProps.load(it) }
def mcSuffix = rootProps.getProperty('mod_mc_suffix')
if (mcSuffix == null || mcSuffix.isEmpty()) {
    throw new GradleException("mod_mc_suffix is missing from gradle.properties; " +
            "it is required so the MC lines cannot collide in the Maven repository.")
}

include 'module.reginth'
include 'module.relink'
include 'module.atlas'
include 'module.main'

project(':module.reginth').name = "abysslib-reginth${mcSuffix}"
project(':module.relink').name = "abysslib-relink${mcSuffix}"
project(':module.atlas').name = "abysslib-atlas${mcSuffix}"
project(':module.main').name = "abysslib${mcSuffix}"
