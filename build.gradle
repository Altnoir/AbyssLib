plugins {
    // 版本在根 build.gradle 声明一次，子项目只引用 id
    id 'net.neoforged.moddev' version '2.0.143' apply false
}

// ---------------------------------------------------------------------------
// 所有子模块共享的构建约定。
// 每个模块自己的 build.gradle 只写差异部分（mod_id / 依赖 / 是否有 run 配置）。
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'idea'

    group = mod_group_id
    version = mod_version

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // NeoForge 26.1.2 / Java 25
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // neoForge.mods.toml 的占位符展开 + 许可随分发一同打包。
    // （MIT 要求再分发时保留版权与许可声明，LICENSE 会被复制进 META-INF/）
    tasks.named('processResources', ProcessResources).configure {
        var replaceProperties = [
                minecraft_version      : minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version_range      : neo_version_range,
                loader_version_range   : loader_version_range,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_license            : mod_license,
                mod_version            : mod_version,
                mod_authors            : mod_authors,
                mod_description        : mod_description,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml']) {
            expand replaceProperties
        }

        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }
    }

    // 防护：本库是纯代码前置库，不向发布产物里塞原版资源覆盖（assets/minecraft/**）。
    // 与 1.21.1 线一致（那边曾因调试残留的 blockstate 覆盖把原版草方块替换掉）。
    tasks.named('jar', Jar).configure {
        exclude 'assets/minecraft/**'
    }

    // 发布到本地仓库，供 26.1 线消费方引用（先在 26.1 worktree 下 ./gradlew publish）
    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                url = rootProject.file('repo')
            }
        }
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
