plugins {
    // 版本在根 build.gradle 声明一次，子项目只引用 id
    id 'net.neoforged.moddev' version '2.0.143' apply false
}

// ---------------------------------------------------------------------------
// 所有子模块共享的构建约定。
// 每个模块自己的 build.gradle 只写差异部分（mod_id / 依赖 / 是否有 run 配置）。
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'idea'

    group = mod_group_id

    // 与 1.21.1 线同一套版本策略：
    //   RELEASE=true  -> 稳定的 <mod_version>，例如 1.0.0（消费方就写这个）
    //   否则（CI 普通构建）-> <mod_version>-<BUILD_NUMBER>，例如 1.0.0-17（快照，可追溯）
    String buildNumber = System.getenv('BUILD_NUMBER')
    boolean dev = System.getenv('RELEASE') == null || System.getenv('RELEASE') == 'false'
    version = mod_version + (dev && buildNumber != null ? "-${buildNumber}" : "")

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // NeoForge 26.1.2 / Java 25
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // neoForge.mods.toml 的占位符展开 + 许可随分发一同打包。
    // （MIT 要求再分发时保留版权与许可声明，LICENSE 会被复制进 META-INF/）
    tasks.named('processResources', ProcessResources).configure {
        var replaceProperties = [
                minecraft_version      : minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version_range      : neo_version_range,
                loader_version_range   : loader_version_range,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_license            : mod_license,
                mod_version            : mod_version,
                mod_authors            : mod_authors,
                mod_description        : mod_description,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml']) {
            expand replaceProperties
        }

        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }
    }

    // 防护：本库是纯代码前置库，不向发布产物里塞原版资源覆盖（assets/minecraft/**）。
    // 与 1.21.1 线一致（那边曾因调试残留的 blockstate 覆盖把原版草方块替换掉）。
    tasks.named('jar', Jar).configure {
        exclude 'assets/minecraft/**'
    }

    // 发布到远端 Reposilite（与 1.21.1 线同一个仓库、同一套凭证）。
    // 注意 url 必须带 /releases 段：Reposilite 寻址是 /<仓库名>/<group>/…，
    // 少了这一段会把 group 的第一节当成仓库名并返回 403（1.21.1 线踩过，见 HANDOFF §0）。
    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                url = "https://maven.ringlo.im/releases"
                credentials {
                    username = providers.environmentVariable("MAVEN_USERNAME").orNull
                    password = providers.environmentVariable("MAVEN_PASSWORD").orNull
                }
            }
        }
    }

    // 本地 file 仓库（供本机消费方解析，仓库外的一次性 init 脚本会追加；见 HANDOFF §2）

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
