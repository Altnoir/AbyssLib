import java.nio.charset.StandardCharsets

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://maven.gegy.dev/releases" } // Registrate（26.1 线：MC26.1-1.5.7）
}

base {
    archivesName = mod_id
}

// NeoForge 26.1.2 / Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// SBM 26.1 没有公开 maven 坐标：把 libs/ 下的本地 jar 原样重打包（只补 Automatic-Module-Name），
// 再以 jarJar 内嵌到本库产物，运行期由本库唯一提供（moddev 会自动扁平化其内部的 mae jarjar）。
def prepareBundledSbm = tasks.register('prepareBundledSbm', Jar) {
    archiveFileName = project.sbm_local_jar
    destinationDirectory = layout.buildDirectory.dir('generated/local-libs')
    from zipTree("libs/${project.sbm_local_jar}")
    manifest {
        attributes 'Automatic-Module-Name': 'com.github.mcmodderanchor.simplebedrockmodel'
    }
}

dependencies {
    // 内置 Registrate：本库是它的唯一提供者（运行时 jarJar 内嵌）。
    implementation jarJar("com.tterrag.registrate:Registrate:${registrate_version}")
    // api：把 Registrate 暴露给消费方编译期（module metadata / POM 以 compile 作用域传递），
    // 消费方无需再自行声明 Registrate；运行仍只由本库 jarJar 提供。
    api "com.tterrag.registrate:Registrate:${registrate_version}"
    // Simple Bedrock Model（26.1）：仅 jarJar 内嵌提供运行时，不 api 暴露
    // （本地文件依赖无法进入发布元数据；需要直接用 SBM API 的模组各自 compileOnly 本地 libs 副本）。
    implementation jarJar(files(prepareBundledSbm))
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // 模板过滤统一使用 UTF-8（expand 读写）
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// 发布到本地仓库，供 26.1 线消费方（Made-In-Abyss-26.1 / PoopSky-26.1.2 等）引用
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
